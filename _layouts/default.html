<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="banana" viewBox="0 0 64 64"><path d="M10 9 C0 48 38 68 62 42 L57 35 C40 47 29 32 31 9 Z" fill="#fffbd0" stroke="#1a1a1a" stroke-width="4.5" stroke-linejoin="round"/><path d="M10 9 L31 9 L30 3 L11 3 Z" fill="#5a3a1b" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><path d="M58 41 L61 44" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/></symbol></svg>
  <div class="runners" aria-hidden="true">
    <svg class="banana" style="--l:8%;--z:51px;--t:11s;--d:0s"><use href="#banana"/></svg>
    <svg class="banana" style="--l:24%;--z:39px;--t:14s;--d:-5s"><use href="#banana"/></svg>
    <svg class="banana" style="--l:44%;--z:60px;--t:12s;--d:-8s"><use href="#banana"/></svg>
    <svg class="banana" style="--l:63%;--z:45px;--t:16s;--d:-3s"><use href="#banana"/></svg>
    <svg class="banana" style="--l:80%;--z:54px;--t:13s;--d:-10s"><use href="#banana"/></svg>
    <svg class="banana" style="--l:93%;--z:36px;--t:15s;--d:-6s"><use href="#banana"/></svg>
    <div class="minion two" style="--b:14%;--s:92px;--t:18s;--d:0s"><span class="name">Kevin</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><svg class="hold"><use href="#banana"/></svg><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion" style="--b:38%;--s:66px;--t:23s;--d:-7s"><span class="name">Stuart</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><svg class="hold"><use href="#banana"/></svg><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:62%;--s:76px;--t:20s;--d:-12s"><span class="name">Dave</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><svg class="hold"><use href="#banana"/></svg><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:84%;--s:52px;--t:15s;--d:-4s"><span class="name">Bob</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><svg class="hold"><use href="#banana"/></svg><i class="leg l1"></i><i class="leg l2"></i></div>
  </div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="https://github.com/khooyj">GitHub</a> · © {{ 'now' | date: '%Y' }} KYJ · Bello! 🍌
    </div>
  </footer>
</body>
</html>

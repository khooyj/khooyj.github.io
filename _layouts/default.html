<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="runners" aria-hidden="true">
    <div class="minion two" style="--b:14%;--s:92px;--t:18s;--d:0s"><span class="name">Kevin</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion" style="--b:38%;--s:66px;--t:23s;--d:-7s"><span class="name">Stuart</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:62%;--s:76px;--t:20s;--d:-12s"><span class="name">Dave</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:84%;--s:52px;--t:15s;--d:-4s"><span class="name">Bob</span><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
  </div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="https://github.com/khooyj">GitHub</a> · © {{ 'now' | date: '%Y' }} KYJ · Bello! 🍌
    </div>
  </footer>
</body>
</html>

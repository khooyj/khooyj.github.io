<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="runners" aria-hidden="true">
    <div class="minion" style="--b:8%;--s:70px;--t:16s;--d:0s"><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:30%;--s:52px;--t:22s;--d:-6s"><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion" style="--b:52%;--s:86px;--t:19s;--d:-11s"><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion two" style="--b:72%;--s:60px;--t:26s;--d:-3s"><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
    <div class="minion" style="--b:90%;--s:44px;--t:14s;--d:-9s"><i class="hair"></i><i class="body"><i class="goggle-s"><i></i></i><i class="goggle-s g2"><i></i></i><i class="smile"></i><i class="overall"></i></i><i class="leg l1"></i><i class="leg l2"></i></div>
  </div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="https://github.com/khooyj">GitHub</a> · © {{ 'now' | date: '%Y' }} KYJ · Bello! 🍌
    </div>
  </footer>
</body>
</html>
